<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Nextsoft Store</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #414141;
  color: #fff;
}

header {
  display:flex;
  align-items:center;
  padding:15px;
  background:#414141;
  position:sticky;
  top:0;
  z-index:10;
}

header img {
  height:40px;
  margin-right:20px;
}

#searchBar {
  flex:1;
  padding:10px;
  font-size:16px;
  border-radius:8px;
  border:1px solid white;
}

#filters {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:15px;
  background:#1d1d1d;
}

.filter {
  padding:8px 12px;
  background:#2b2b2b;
  border-radius:8px;
  cursor:pointer;
}

.filter:hover {
  background:#1b1b1b;
}

#appGrid {
  padding:20px;
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap:20px;
}

.appCard {
  background:#2b2b2b;
  border-radius:12px;
  padding:15px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.appCard img {
  width:80px;
  height:80px;
  object-fit:contain;
  margin-bottom:10px;
}

.appCard h3 {
  margin:5px 0;
  font-size:18px;
}

.appCard p {
  font-size:10px;
}
</style>
</head>

<body>

<header>
<img src="https://raw.githubusercontent.com/nextsoftcorp-micaelcarlos/nextsoftcorp-micaelcarlos.github.io/main/Nextsoft-store-dark.svg">
<input id="searchBar" type="text" placeholder="Search apps...">
</header>

<div id="filters">
  <div class="filter">Productivity</div>
  <div class="filter">Games</div>
  <div class="filter">Utilities</div>
  <div class="filter">Music & Video</div>
  <div class="filter">System</div>
  <div class="filter">Internet</div>
  <div class="filter">Graphics & Photography</div>
  <div class="filter">Packages and Updates</div>
</div>

<div id="appGrid"></div>

<script>
const repoOwner = "nextsoftcorp-micaelcarlos";
const repoName  = "nextsoftcorp-micaelcarlos.github.io";
const basePath  = "nextsoft-store/Apps";

const grid = document.getElementById("appGrid");

// ====================
//   CARREGA APPS
// ====================
async function loadApps() {

  try {
    const apiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${basePath}`;
    const res = await fetch(apiURL);

    const folders = await res.json();

    for (const item of folders) {
      if (item.type === "dir") {
        loadApp(item.name);
      }
    }
  }

  catch(err){
    grid.innerHTML = `<p style="color:red">Erro ao ler repositório</p>`;
  }
}

// ====================
//   CARREGA CADA APP
// ====================
async function loadApp(folderName){

  const appBase = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${basePath}/${folderName}/`;

  let description = "No description available.";
  let category    = "Uncategorized";

  // ---- DESCRIÇÃO ----
  try {
    const txt = await fetch(appBase + "description.txt").then(r=>r.text());

    txt.split("\n").forEach(line=>{
      if(line.toLowerCase().startsWith("description:"))
        description = line.split(":").slice(1).join(":").trim();

      if(line.toLowerCase().startsWith("category:"))
        category = line.split(":").slice(1).join(":").trim();
    });
  } catch(e){}

  // ---- ÍCONE AUTO ----
  let iconUrl = "https://raw.githubusercontent.com/nextsoftcorp-micaelcarlos/Nextsoft-store/main/NoIcon.svg";

  try {
    const listURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${basePath}/${folderName}`;
    const files = await fetch(listURL).then(r=>r.json());

    const icon = files.find(f =>
      f.name.toLowerCase().endsWith(".svg") ||
      f.name.toLowerCase().endsWith(".png")
    );

    if(icon) iconUrl = icon.download_url;
  }
  catch(e){}

  // ---- CARD ----
  const card = document.createElement("div");
  card.className = "appCard";
  card.dataset.category = category;

  card.innerHTML = `
    <img src="${iconUrl}">
    <h3>${folderName.replaceAll("-", " ").replace(/\b\w/g, c => c.toUpperCase())}</h3>
    <p>${description}</p>
  `;

  grid.appendChild(card);
}

// ====================
//    CATEGORIAS
// ====================
document.querySelectorAll(".filter").forEach(filter=>{
  filter.addEventListener("click", ()=>{
    const sel = filter.textContent;

    document.querySelectorAll(".appCard").forEach(card=>{
      card.style.display =
        sel === card.dataset.category ? "flex" : "none";
    });
  });
});

// ====================
//    PESQUISA
// ====================
document.getElementById("searchBar").addEventListener("input", e=>{

  const q = e.target.value.toLowerCase();

  document.querySelectorAll(".appCard").forEach(card=>{
    card.style.display =
      card.querySelector("h3").textContent.toLowerCase().includes(q)
      ? "flex" : "none";
  });

});

// ====================
//    START
// ====================
loadApps();

</script>

</body>
</html>
