troke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">CoreX Kernel version 1.0.3.0</tspan></text><text transform="translate(259.6396,173.93854) scale(0.21009,0.21009)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Why update?</tspan></text><text transform="translate(191.73196,181.00349) scale(0.14879,0.14879)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">CoreX, as well every other Operating System needs updates to function</tspan><tspan x="0" dy="48px">properly. Here you can check if your Computer needs to update</tspan><tspan x="0" dy="48px">something. Every month will be release a new update for CoreX Kernel,</tspan><tspan x="0" dy="48px">improving performance and security, and System apps will be updated</tspan><tspan x="0" dy="48px">every 1-3 months, adding new features and fixings bugs.</tspan></text><text transform="translate(233.63696,276.72317) scale(0.14879,0.14879)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">To frequently asked questions, see more in</tspan></text><text transform="translate(238.3352,283.0881) scale(0.14879,0.14879)" font-size="40" xml:space="preserve" fill="#0090ff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">www.nextsoft.com/forum/topics/corex</tspan></text><path d="M379.78887,212.87297l-187.58624,0.36284" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/><text transform="translate(192.17949,234.33069) scale(0.14326,0.14326)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">• Improved system performance and responsiveness</tspan><tspan x="0" dy="48px">• Enhanced animation smoothness and interface fluidity</tspan><tspan x="0" dy="48px">• Visual refinements for a more consistent look</tspan><tspan x="0" dy="48px">• Stability improvements and bug fixes</tspan></text><path d="M191.44122,270.01396l187.58624,-0.36284" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/><text transform="translate(230.01053,289.56768) scale(0.14879,0.14879)" font-size="40" xml:space="preserve" fill="#000000" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Copyright   2021-2026 Nextsoft Corporation</tspan></text><text transform="translate(289.75237,136.227) scale(0.16388,0.16388)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">IonDesktop version 1.0</tspan></text><text transform="translate(266.27795,219.9541) scale(0.17237,0.17237)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">What's new?</tspan></text><text transform="translate(250.16579,226.02051) scale(0.1439,0.1439)" font-size="40" xml:space="preserve" fill="#ffa000" stroke="#ffffff" stroke-width="0" stroke-linecap="butt" font-family="&quot;Leelawadee UI&quot;, Sans Serif" font-weight="normal" text-ancho